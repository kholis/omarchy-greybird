<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Xubuntu look: font rendering - anti-aliasing on, slight hinting, RGB
       subpixel order, default LCD filter. Applies to every toolkit that
       defers to fontconfig (Chromium, Electron, Qt, ...). GTK apps get the
       same values via gsettings + gtk-xft-* keys in the settings.ini files. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Xubuntu look: Noto Sans wins the generic sans-serif default.
       Omarchy's 50-omarchy.conf (which runs earlier, at priority 50-omarchy
       vs 50-user) REPLACES any pattern containing "sans-serif" with
       "Liberation Sans" via mode="assign". By the time this file runs the
       sans-serif token is gone, so we prepend Noto Sans in front of the
       Liberation Sans that is left behind. Omarchy's nerd-font / emoji
       fallbacks stay behind both. Monospace (JetBrainsMono) and serif
       (Liberation Serif) are intentionally left on Omarchy's defaults. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>

  <!-- Xubuntu look: substitute GNOME's default interface font with Noto Sans
       (libadwaita apps default to Adwaita Sans when no font is configured).
       Cantarell is not installed on this system; any legacy request for it
       falls through the unknown-family chain, which also lands on Noto Sans. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Adwaita Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit>
  </match>

  <!-- Windows: Segoe UI (incl. Variable) -> Selawik (Microsoft's open Segoe UI clone) -->
  <match target="pattern">
    <test name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Variable</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Semibold</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik Semibold</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik Light</string></edit>
  </match>

  <!-- macOS: system font stack -> Inter (closest free match to SF Pro) -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro Display</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Pro Text</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter Variable</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>

</fontconfig>
